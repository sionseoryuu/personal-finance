const CATS=[["Gaji","💼","income"],["Bonus","🎁","income"],["Bisnis","🏪","income"],["Freelance","💻","income"],["Investasi","📈","income"],["Pemasukan lainnya","➕","income"],
["Makanan","🍜","expense"],["Minuman","☕","expense"],["Transportasi","🚌","expense"],["Bensin","⛽","expense"],["Tempat tinggal","🏠","expense"],["Listrik","💡","expense"],["Internet","📶","expense"],["Belanja","🛍️","expense"],["Kesehatan","💊","expense"],["Pendidikan","🎓","expense"],["Hiburan","🎬","expense"],["Langganan","🔁","expense"],["Cicilan","🧾","expense"],["Pengeluaran lainnya","📦","expense"]].map(c=>({name:c[0],icon:c[1],type:c[2],active:true}));
let S={};
const defs=()=>({settings:{name:"",dark:null,v:VER},accounts:[],transactions:[],categories:JSON.parse(JSON.stringify(CATS)),budgets:[],bills:[],debts:[],receivables:[],goals:[],notifications:[]});
function loadData(){const d=defs();KEYS.forEach(k=>{try{const r=localStorage.getItem("pfi_"+k);S[k]=r?JSON.parse(r):d[k]}catch(e){S[k]=d[k]}});validateData()}
function validateData(){if(!Array.isArray(S.accounts))S.accounts=[];if(!Array.isArray(S.transactions))S.transactions=[];["budgets","bills","debts","receivables","goals","notifications"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!Array.isArray(S.categories)||!S.categories.length)S.categories=defs().categories;S.settings=Object.assign(defs().settings,S.settings||{});S.settings.v=VER}
function saveData(){try{KEYS.forEach(k=>localStorage.setItem("pfi_"+k,JSON.stringify(S[k])))}catch(e){toast("Penyimpanan gagal: "+e.message)}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>(n<0?"-":"")+"Rp"+Math.abs(Math.round(n)).toLocaleString((S.settings&&S.settings.nf)||"id-ID");
const uid=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hide"),2600)}
const cat=n=>S.categories.find(c=>c.name===n)||{icon:"📦",name:n};
function balance(a){let b=a.initial|0;S.transactions.forEach(t=>{if(t.type==="income"&&t.acc===a.id)b+=t.amt;else if(t.type==="expense"&&t.acc===a.id)b-=t.amt;else if(t.type==="refund"&&t.acc===a.id)b+=t.amt;else if(t.type==="adjustment"&&t.acc===a.id)b+=(t.dir||1)*t.amt;else if(t.type==="transfer"){if(t.acc===a.id)b-=t.amt;if(t.to===a.id)b+=t.amt}});return b}
function range(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let a,b=iso(n);
if(p==="today")a=b;else if(p==="7d"){const d=new Date(n);d.setDate(d.getDate()-6);a=iso(d)}
else if(p==="month")a=iso(new Date(y,m,1));else if(p==="last"){a=iso(new Date(y,m-1,1));b=iso(new Date(y,m,0))}
else if(p==="year")a=iso(new Date(y,0,1));else{a="0000-01-01";b="9999-12-31"}return[a,b]}
const inR=(t,[a,b])=>t.date>=a&&t.date<=b;
function sum(list,type){return list.filter(t=>t.type===type||(type==="expense"&&t.type==="refund")).reduce((s,t)=>s+(t.type==="refund"?-t.amt:t.amt),0)}
let view="dash",period="month",F={q:"",type:"",acc:""};
const NAV=[["dash","Beranda","🏠"],["tx","Transaksi","🧾"],["acc","Akun","👛"],["bud","Anggaran","🎯"],["plan","Rencana","📋"],["ana","Analitik","📊"],["ai","Asisten","💬"],["cal","Kalender","📅"],["rep","Laporan","📑"],["notif","Notifikasi","🔔"],["set","Pengaturan","⚙️"]];
function render(){
const nv=NAV.map(n=>`<a data-act="go" data-v="${n[0]}" class="${view===n[0]?"on":""}"><span>${n[2]}</span>${n[1]}</a>`).join("");
$("#nav").innerHTML='<div class="brand"><img src="'+AVA+'" alt=""><b>PERSONAL FINANCE INTELLIGENCE</b></div>'+nv.replace(/<span>.*?<\/span>/g,m=>m.replace(/<\/?span>/g,"")+" ");
$("#mb").innerHTML=nv;
$("#main").innerHTML=({dash,tx,acc,bud,plan,ana,ai,cal,rep,notif,set})[view]();
document.body.dataset.v=view}
function empty(msg){return`<div class="card lbl" style="text-align:center"><img class="emp" src="${AVA}" alt="">${msg}</div>`}
function dash(){
const R=range(period),L=S.transactions.filter(t=>inR(t,R)),inc=sum(L,"income"),exp=sum(L,"expense"),net=inc-exp;
const total=S.accounts.reduce((s,a)=>s+balance(a),0);
const mr=range("month"),me=sum(S.transactions.filter(t=>inR(t,mr)&&t.type==="expense"),"expense"),mlim=S.budgets.filter(b=>b.cat==="*").reduce((s,b)=>s+b.limit,0);
const byc={};Object.assign(byc,catSum(L));
const top=Object.entries(byc).sort((a,b)=>b[1]-a[1]);const mx=top[0]?top[0][1]:1;
const sr=inc>0?Math.round(net/inc*100):null;
const opt=[["today","Hari ini"],["7d","7 hari"],["month","Bulan ini"],["last","Bulan lalu"],["year","Tahun ini"],["all","Semua"]];
return`<div class="hd"><img class="ava" src="${AVA}" alt=""><h2 style="margin:0">Halo${S.settings.name?", "+esc(S.settings.name):""}</h2></div>
<div class="tools"><select data-chg="period">${opt.map(o=>`<option value="${o[0]}" ${period===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>
${S.transactions.some(t=>t.demo)?'<p><span class="badge">DEMO DATA</span> <span class="lbl">Hapus di Pengaturan.</span></p>':""}
<div class="grid">
<div class="card"><div class="lbl">Total saldo</div><div class="big">${rp(total)}</div></div>
<div class="card"><div class="lbl">Pemasukan</div><div class="big pos">${rp(inc)}</div></div>
<div class="card"><div class="lbl">Pengeluaran</div><div class="big neg">${rp(exp)}</div></div>
<div class="card"><div class="lbl">Arus kas bersih</div><div class="big ${net<0?"neg":"pos"}">${rp(net)}</div></div>
<div class="card"><div class="lbl">Saving rate</div><div class="big">${sr===null?"–":sr+"%"}</div><div class="lbl">${sr===null?"Belum ada pemasukan pada periode ini":"(Pemasukan − Pengeluaran) / Pemasukan"}</div></div>
<div class="card"><div class="lbl">Sisa anggaran bulan ini</div><div class="big">${mlim?rp(mlim-me):"–"}</div><div class="lbl">${mlim?"":"Belum ada anggaran total"}</div></div></div>
<div class="card"><h3>Pengeluaran per kategori</h3>${top.length?top.slice(0,6).map(([n,v])=>`<div style="margin-bottom:10px"><div class="row" style="border:0;padding:0"><span>${cat(n).icon}</span><span class="grow">${esc(n)}</span><b>${rp(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:${cat(n).color||"var(--ac)"}"></i></div></div>`).join(""):empty("Belum ada pengeluaran pada periode ini.")}</div>
${insHTML()}<div class="card"><h3>Transaksi terbaru</h3>${L.length?txRows(L.slice().sort(cmp).slice(0,5)):empty("Belum ada transaksi. Tekan + untuk mencatat.")}</div>`}
const cmp=(a,b)=>(b.date+(b.time||""))>(a.date+(a.time||""))?1:-1;
function accName(id){const a=S.accounts.find(x=>x.id===id);return a?a.name:"?"}
function txRows(L,del){return L.map(t=>{const pl=t.type==="income"||t.type==="refund"||(t.type==="adjustment"&&(t.dir||1)>0),mi=t.type==="expense"||(t.type==="adjustment"&&t.dir<0),sign=pl?"+":mi?"−":"",col=pl?"pos":mi?"neg":"";
return`<div class="row" data-act="det" data-id="${t.id}" style="cursor:pointer"><div class="ic">${t.type==="transfer"?"🔄":t.type==="adjustment"?"⚖️":cat(t.cat).icon}</div><div class="grow"><b>${esc(t.desc||t.cat||"Transfer")}</b>${t.demo?'<span class="badge">DEMO</span>':""}<small>${fd(t.date)} · ${t.type==="transfer"?esc(accName(t.acc))+" → "+esc(accName(t.to)):esc(accName(t.acc))}${t.cat?" · "+esc(t.cat)+(t.sub?"/"+esc(t.sub):""):""}</small></div><b class="${col}">${sign}${rp(t.amt).replace("-","")}</b>${del&&t.type!=="transfer"?`<button class="btn g" data-act="edittx" data-id="${t.id}" aria-label="Ubah">✏️</button><button class="btn g" data-act="duptx" data-id="${t.id}" aria-label="Duplikasi">📄</button>`:""}${del?`<button class="btn g" data-act="deltx" data-id="${t.id}" aria-label="Hapus">🗑</button>`:""}</div>`}).join("")}

function acc(){
return`<h2>Akun</h2><div class="tools"><button class="btn" data-act="addacc">+ Akun</button><button class="btn g" data-act="addtr">Transfer</button></div>
${S.accounts.length?`<div class="card">${S.accounts.map(a=>`<div class="row"><div class="ic">${a.icon||"👛"}</div><div class="grow"><b>${esc(a.name)}</b>${a.demo?'<span class="badge">DEMO</span>':""}<small>${esc(a.kind)} · saldo awal ${rp(a.initial)}</small></div><b>${rp(balance(a))}</b><button class="btn g" data-act="delacc" data-id="${a.id}" aria-label="Hapus">🗑</button></div>`).join("")}</div>`:empty("Belum ada akun. Tambahkan dompet atau rekening pertama Anda.")}`}
function spent(b){const R=b.period==="week"?range("7d"):range("month");return S.transactions.filter(t=>(t.type==="expense"||t.type==="refund")&&inR(t,R)&&(b.cat==="*"||t.cat===b.cat)).reduce((s,t)=>s+(t.type==="refund"?-t.amt:t.amt),0)}
function bud(){
return`<h2>Anggaran</h2><div class="tools"><button class="btn" data-act="addbud">+ Anggaran</button></div>
${S.budgets.length?S.budgets.map(b=>{const u=spent(b),p=Math.round(u/b.limit*100),c=p>=100?"var(--exp)":p>=75?"var(--wr)":"var(--pr)";
const msg=p>100?"Melebihi anggaran "+rp(u-b.limit):`Terpakai ${p}%. Sisa ${rp(b.limit-u)}.`;
return`<div class="card"><div class="row" style="border:0;padding:0"><b class="grow">${b.cat==="*"?"Semua pengeluaran":esc(b.cat)} <small class="lbl" style="display:inline">(${b.period==="week"?"7 hari terakhir":"bulan ini"})</small></b><button class="btn g" data-act="delbud" data-id="${b.id}" aria-label="Hapus">🗑</button></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:${c}"></i></div><div class="lbl" style="margin-top:6px">${msg} Batas ${rp(b.limit)}.</div></div>`}).join(""):empty("Belum ada anggaran. Buat batas pengeluaran per kategori.")}`}
function set(){
return`<h2>Pengaturan</h2><div class="card"><form data-form="prof"><label>Nama</label><input name="name" value="${esc(S.settings.name)}" maxlength="40"><div style="margin-top:12px"><button class="btn">Simpan nama</button></div></form></div>
<div class="card"><h3>Tampilan</h3><div class="tools"><button class="btn g" data-act="theme">Ganti mode terang/gelap</button><button class="btn g" data-act="welcome">Tampilkan welcome screen</button></div></div>
<div class="card"><h3>Data</h3><div class="tools"><button class="btn g" data-act="demo">Load Demo Data</button><button class="btn g" data-act="cleardemo">Clear Demo Data</button><button class="btn g" data-act="export">Export backup JSON</button><button class="btn g" data-act="import">Import backup</button><button class="btn d" data-act="resetall">Reset All Data</button></div>

function closeM(){editId=null;pendAtt=null;$("#modal").classList.add("hide")}
function opts(a,sel){return a.map(x=>`<option value="${esc(x.id||x.name)}" ${sel===(x.id||x.name)?"selected":""}>${esc(x.name)}</option>`).join("")}
function needAcc(){if(!S.accounts.length){toast("Tambahkan akun terlebih dahulu");view="acc";render();return true}return false}
let txType="expense";

return`<h3>${editId?"Ubah transaksi":"Catat transaksi"}</h3><form data-form="tx"><div class="seg" role="group" style="flex-wrap:wrap">${[["expense","Pengeluaran"],["income","Pemasukan"],["refund","Refund"],["adjustment","Penyesuaian"]].map(([k,l])=>`<button type="button" class="btn g ${txType===k?"on":""}" data-act="ttype" data-t="${k}">${l}</button>`).join("")}</div>
${E?"":chips()}${txType==="adjustment"?`<label>Arah</label><select name="dir"><option value="1">Tambah saldo</option><option value="-1" ${E&&E.dir<0?"selected":""}>Kurangi saldo</option></select>`:""}<label>Nominal (Rp)</label><input class="amt" name="amt" inputmode="numeric" placeholder="0" value="${E?E.amt:""}" required>
<label>Kategori</label><select name="cat">${S.categories.filter(c=>c.type===(txType==="income"?"income":"expense")&&c.active!==false).map(c=>`<option value="${esc(c.name)}" ${E&&E.cat===c.name?"selected":""}>${c.icon} ${esc(c.name)}</option>`).join("")}</select>
<label>Subkategori (opsional)</label><input name="sub" list="sl" maxlength="30" value="${E?esc(E.sub||""):""}"><datalist id="sl">${S.categories.filter(c=>c.type===(txType==="income"?"income":"expense")).flatMap(c=>c.subs||[]).map(x=>`<option value="${esc(x)}">`).join("")}</datalist><label>Akun</label><select name="acc">${opts(S.accounts,E&&E.acc)}</select><label>Tanggal</label><input type="date" name="date" value="${E?E.date:iso(new Date())}" required>
<label>Jam</label><input type="time" name="time" value="${E?E.time||"":""}"><label>Metode pembayaran</label><select name="method">${["","Tunai","Transfer","Debit","Kredit","QRIS","E-wallet"].map(m=>`<option ${E&&E.method===m?"selected":""}>${m}</option>`).join("")}</select><label>Tag (pisahkan koma)</label><input name="tags" value="${E?esc((E.tags||[]).join(", ")):""}"><label>Catatan</label><input name="note" value="${E?esc(E.note||""):""}"><label>Lampiran foto (opsional)</label><input type="file" name="attf" accept="image/*"><label>Deskripsi</label><input name="desc" maxlength="80" placeholder="mis. makan siang" value="${E?esc(E.desc):""}"><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1">Simpan</button><button type="button" class="btn g" data-act="close">Batal</button></div></form>`}
const num=v=>{const n=parseInt(String(v).replace(/\D/g,""),10);return Number.isFinite(n)?n:0};
document.addEventListener("submit",e=>{const f=e.target.dataset.form;if(!f||!["tx","acc","tr","bud","prof"].includes(f))return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
if(f==="tx"){const amt=num(d.amt);if(amt<=0)return toast("Nominal harus lebih dari 0");if(!d.date)return toast("Tanggal wajib diisi");
const adj=txType==="adjustment",o={type:txType,amt,cat:adj?"":d.cat,sub:adj?"":(d.sub||"").trim(),acc:d.acc,date:d.date,time:d.time||"",method:d.method||"",tags:(d.tags||"").split(",").map(x=>x.trim()).filter(Boolean),note:(d.note||"").trim(),desc:d.desc.trim()||(adj?"Penyesuaian saldo":"")};if(adj)o.dir=+d.dir===-1?-1:1;if(pendAtt)o.att=pendAtt;pendAtt=null;if(editId){const x=S.transactions.find(t=>t.id===editId)||{},ch=chg(x,o);if(ch.length)(x.log=x.log||[]).push({at:new Date().toISOString(),ch});Object.assign(x,o)}else S.transactions.push(Object.assign({id:uid()},o));editId=null;}
else if(f==="acc"){if(!d.name.trim())return toast("Nama akun wajib diisi");S.accounts.push({id:uid(),name:d.name.trim(),kind:d.kind,initial:num(d.initial),icon:{Cash:"💵",Bank:"🏦","E-wallet":"📱",Savings:"🐖",Other:"👛"}[d.kind]})}
else if(f==="tr"){const amt=num(d.amt);if(amt<=0)return toast("Nominal harus lebih dari 0");if(d.acc===d.to)return toast("Akun asal dan tujuan tidak boleh sama");
S.transactions.push({id:uid(),type:"transfer",amt,acc:d.acc,to:d.to,date:iso(new Date()),desc:"Transfer"});const fee=num(d.fee);if(fee>0)S.transactions.push({id:uid(),type:"expense",amt:fee,cat:"Pengeluaran lainnya",acc:d.acc,date:iso(new Date()),desc:"Biaya transfer"})}
else if(f==="bud"){const l=num(d.limit);if(l<=0)return toast("Batas harus lebih dari 0");S.budgets.push({id:uid(),cat:d.cat,limit:l,period:d.period})}
else if(f==="prof"){S.settings.name=d.name.trim();toast("Tersimpan")}
saveData();closeM();render();if(f==="tx")toast("Transaksi disimpan")});
function demo(){if(S.transactions.some(t=>t.demo))return toast("Data demo sudah dimuat");
const a=[["Dompet tunai","Cash",300000],["BCA","Bank",5000000],["GoPay","E-wallet",250000]].map(x=>({id:uid(),name:x[0],kind:x[1],initial:x[2],icon:{Cash:"💵",Bank:"🏦","E-wallet":"📱"}[x[1]],demo:true}));
S.accounts.push(...a);const n=new Date(),T=(d,type,amt,c,ac,desc)=>{const x=new Date(n.getFullYear(),n.getMonth(),Math.max(1,n.getDate()-d));S.transactions.push({id:uid(),type,amt,cat:c,acc:a[ac].id,date:iso(x),desc,demo:true})};
T(0,"income",6000000,"Gaji",1,"Gaji bulanan");T(0,"expense",25000,"Makanan",0,"Makan siang");T(1,"expense",18000,"Minuman",2,"Kopi");T(2,"expense",150000,"Transportasi",2,"Ojek online");T(3,"expense",450000,"Belanja",1,"Belanja bulanan");T(4,"expense",120000,"Hiburan",1,"Nonton & jajan");T(5,"expense",350000,"Listrik",1,"Token listrik");T(6,"income",500000,"Freelance",1,"Proyek desain");
S.budgets.push({id:uid(),cat:"Makanan",limit:600000,period:"month",demo:true},{id:uid(),cat:"*",limit:3000000,period:"month",demo:true});saveData();render();toast("Data demo dimuat")}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const A=el.dataset.act,id=el.dataset.id;
if(A==="start"){ls("pfi_onboarding","done");enter()}
else if(A==="go"){view=el.dataset.v;render();scrollTo(0,0)}
else if(A==="addtx"){if(needAcc())return;txType="expense";modal(txForm())}
else if(A==="ttype"){txType=el.dataset.t;const m=$("#mbody form"),v={};new FormData(m).forEach((x,k)=>v[k]=x);modal(txForm());const f=$("#mbody form");["amt","acc","date","desc"].forEach(k=>{if(v[k]!=null)f.elements[k].value=v[k]})}
else if(A==="close")closeM();
else if(A==="deltx"){cf("Hapus transaksi ini? Saldo dan laporan akan dihitung ulang.",()=>{S.transactions=S.transactions.filter(t=>t.id!==id);saveData();render()})}
else if(A==="delacc"){if(S.transactions.some(t=>t.acc===id||t.to===id))return toast("Akun memiliki transaksi dan tidak bisa dihapus");S.accounts=S.accounts.filter(a=>a.id!==id);saveData();render()}
else if(A==="delbud"){S.budgets=S.budgets.filter(b=>b.id!==id);saveData();render()}
else if(A==="addacc")modal(`<h3>Akun baru</h3><form data-form="acc"><label>Nama</label><input name="name" required maxlength="30"><label>Jenis</label><select name="kind">${["Cash","Bank","E-wallet","Savings","Other"].map(k=>`<option>${k}</option>`).join("")}</select><label>Saldo awal (Rp)</label><input name="initial" inputmode="numeric" value="0"><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1">Simpan akun</button><button type="button" class="btn g" data-act="close">Batal</button></div></form>`);
else if(A==="addtr"){if(S.accounts.length<2)return toast("Butuh minimal 2 akun untuk transfer");modal(`<h3>Transfer antar-akun</h3><form data-form="tr"><label>Dari</label><select name="acc">${opts(S.accounts)}</select><label>Ke</label><select name="to">${opts(S.accounts,S.accounts[1].id)}</select><label>Nominal (Rp)</label><input name="amt" class="amt" inputmode="numeric" required><label>Biaya transfer (opsional)</label><input name="fee" inputmode="numeric" value="0"><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1">Transfer</button><button type="button" class="btn g" data-act="close">Batal</button></div></form>`)}
else if(A==="addbud")modal(`<h3>Anggaran baru</h3><form data-form="bud"><label>Kategori</label><select name="cat"><option value="*">Semua pengeluaran</option>${S.categories.filter(c=>c.type==="expense").map(c=>`<option>${esc(c.name)}</option>`).join("")}</select><label>Periode</label><select name="period"><option value="month">Bulan ini</option><option value="week">7 hari terakhir</option></select><label>Batas (Rp)</label><input name="limit" class="amt" inputmode="numeric" required><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1">Simpan</button><button type="button" class="btn g" data-act="close">Batal</button></div></form>`);
else if(A==="reset"){F={q:"",type:"",acc:""};render()}
else if(A==="theme"){const d=document.documentElement.dataset.theme==="dark";S.settings.dark=!d;saveData();applyTheme()}
else if(A==="welcome"){ls("pfi_onboarding","");location.reload()}
else if(A==="demo")demo();
else if(A==="cleardemo"){cf("Hapus semua data demo?",()=>{const dm=new Set(S.accounts.filter(a=>a.demo).map(a=>a.id));S.transactions=S.transactions.filter(t=>!t.demo&&!dm.has(t.acc));S.accounts=S.accounts.filter(a=>!a.demo);S.budgets=S.budgets.filter(b=>!b.demo);saveData();render()})}
else if(A==="resetall"){cf("Reset SEMUA data? Tindakan ini tidak dapat dibatalkan.",()=>{KEYS.forEach(k=>{try{localStorage.removeItem("pfi_"+k)}catch(x){}});loadData();saveData();render();toast("Data direset")})}
else if(A==="export"){const b=new Blob([JSON.stringify({version:VER,exported:new Date().toISOString(),data:S},null,1)],{type:"application/json"});const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="pfi-backup-"+iso(new Date())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
else if(A==="import"){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data)throw 0;cf("Timpa data saat ini dengan backup ini?",()=>{S=j.data;validateData();saveData();render();toast("Backup dipulihkan")})}catch(x){toast("File backup tidak valid")}};r.readAsText(i.files[0])};i.click()}});
document.addEventListener("change",e=>{const c=e.target.dataset.chg;if(!c)return;if(c==="period")period=e.target.value;if(c==="ftype")F.type=e.target.value;if(c==="facc")F.acc=e.target.value;render()});
document.addEventListener("input",e=>{if(e.target.dataset.inp==="q"){F.q=e.target.value;const p=e.target.selectionStart;render();const i=$('[data-inp="q"]');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});
function applyTheme(){const d=S.settings.dark;if(d===null)document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=d?"dark":"light"}
const QUOTES=["Masa depan finansial yang baik dimulai dari keputusan kecil hari ini.","Bukan seberapa besar uang yang kamu miliki, tetapi seberapa bijak kamu mengelolanya.","Sedikit demi sedikit, kebiasaan baik akan membangun masa depan yang besar.","Jangan biarkan uang mengendalikan hidupmu. Belajarlah mengendalikan uangmu.","Setiap transaksi yang tercatat adalah langkah menuju kesadaran finansial.","Menabung bukan tentang menyisakan uang, tetapi tentang merencanakan masa depan.","Konsistensi kecil hari ini adalah pencapaian besar di masa depan.","Kamu tidak harus kaya hari ini. Kamu hanya perlu membuat keputusan yang lebih baik hari ini.","Disiplin finansial adalah hadiah terbaik untuk dirimu di masa depan.","Tujuan besar dimulai dari langkah kecil yang dilakukan secara konsisten."];
function enter(){const w=$("#welcome");w.classList.add("out");setTimeout(()=>w.classList.add("hide"),600);$("#app").classList.remove("hide");$("#fab").classList.remove("hide");render()}
function intro(){const w=$("#welcome");$("#hero").src=HERO;w.classList.remove("hide");$("#quote").textContent="“"+QUOTES[Math.floor(Math.random()*QUOTES.length)]+"”";
const txt="Take Control of Your Money, Take Control of Your Future.",t=$("#tag");let i=0;
if(matchMedia("(prefers-reduced-motion:reduce)").matches){t.textContent=txt;return}
const id=setInterval(()=>{t.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(id)},38)}
let editId=null;
const daysTo=d=>Math.round((new Date(d+"T00:00:00")-new Date(iso(new Date())+"T00:00:00"))/864e5);
const rem=o=>o.amt-o.pays.reduce((s,p)=>s+p.amt,0);
const dueTxt=d=>{const n=daysTo(d);return n<0?"terlambat "+(-n)+" hari":n===0?"hari ini":n+" hari lagi"};
function nextDue(d,r){const x=new Date(d+"T00:00:00");if(r==="daily")x.setDate(x.getDate()+1);else if(r==="weekly")x.setDate(x.getDate()+7);else if(r==="monthly")x.setMonth(x.getMonth()+1);else x.setFullYear(x.getFullYear()+1);return iso(x)}
const RL={none:"Sekali",daily:"Harian",weekly:"Mingguan",monthly:"Bulanan",yearly:"Tahunan"};
const fi=(l,n,x="")=>`<label>${l}</label><input name="${n}" ${x}>`;
const fm=(n,t,f)=>modal(`<h3>${t}</h3><form data-form="${n}">${f}<div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1">Simpan</button><button type="button" class="btn g" data-act="close">Batal</button></div></form>`);
const hid=(n,v)=>`<input type="hidden" name="${n}" value="${v}">`,AM='inputmode="numeric" required';
const del=(c,id)=>`<button class="btn g" data-act="delitem" data-c="${c}" data-id="${id}" aria-label="Hapus">🗑</button>`;
const sec=(t,b,body)=>`<div class="card"><div class="row" style="border:0;padding:0 0 6px"><h3 class="grow" style="margin:0">${t}</h3>${b}</div>${body}</div>`;
const none='<p class="lbl">Belum ada data.</p>';
function plan(){
const bills=S.bills.slice().sort((a,b)=>(a.done-b.done)||(a.due>b.due?1:-1));
const bl=bills.map(b=>`<div class="row"><div class="ic">${cat(b.cat).icon}</div><div class="grow"><b>${esc(b.name)}</b><small>${rp(b.amt)} · ${RL[b.rep]} · ${b.done?"Lunas":"jatuh tempo "+b.due+" ("+dueTxt(b.due)+")"} · ${b.hist.length}x dibayar</small></div>${b.done?"":`<button class="btn g" data-act="paybill" data-id="${b.id}">Bayar</button>`}${del("bills",b.id)}</div>`).join("")||none;
const obl=(c,pay)=>S[c].map(o=>{const r=rem(o);return`<div class="row"><div class="grow"><b>${esc(o.who)}</b><small>Total ${rp(o.amt)} · sisa ${rp(r)} · ${r<=0?"Lunas":o.due?"jatuh tempo "+o.due+" ("+dueTxt(o.due)+")":"tanpa jatuh tempo"}</small></div>${r>0?`<button class="btn g" data-act="pay" data-c="${c}" data-id="${o.id}">${pay}</button>`:""}${del(c,o.id)}</div>`}).join("")||none;
const gl=S.goals.map(g=>{const s=g.deps.reduce((x,d)=>x+d.amt,0),p=Math.min(100,Math.round(s/g.target*100)),rate=s/Math.max(1,-daysTo(g.start)+1);let est="Belum ada setoran untuk estimasi.";
if(s>=g.target)est="Target tercapai 🎉";else if(s>0){const x=new Date();x.setDate(x.getDate()+Math.ceil((g.target-s)/rate));est="Estimasi tercapai "+iso(x)+", dari rata-rata setoran aktual "+rp(Math.round(rate*30))+"/bulan."}
return`<div class="row" style="display:block"><div class="row" style="border:0;padding:0"><b class="grow">${esc(g.name)}</b><button class="btn g" data-act="dep" data-id="${g.id}">Setor</button>${del("goals",g.id)}</div><div class="bar"><i style="width:${p}%;background:var(--pr)"></i></div><div class="lbl" style="margin-top:6px">${rp(s)} dari ${rp(g.target)} (${p}%)${g.deadline?" · target "+g.deadline:""}<br>${est}</div></div>`}).join("")||none;
const ab=(a,t)=>`<button class="btn" data-act="${a}">${t}</button>`;
return`<h2>Rencana</h2>${sec("Tagihan",ab("addbill","+ Tagihan"),bl)}${sec("Utang",`<button class="btn" data-act="addobl" data-c="debts">+ Utang</button>`,obl("debts","Bayar"))}${sec("Piutang",`<button class="btn" data-act="addobl" data-c="receivables">+ Piutang</button>`,obl("receivables","Terima"))}${sec("Target keuangan",ab("addgoal","+ Target"),gl)}<p class="lbl">Mencatat utang/piutang baru tidak mengubah saldo akun. Pembayaran dan penerimaan tercatat sebagai transaksi. Setoran target adalah alokasi dan tidak memindahkan saldo.</p>`}
function insights(){const o=[],cur=S.transactions.filter(t=>inR(t,range("month"))),prv=S.transactions.filter(t=>inR(t,range("last"))),ce=sum(cur,"expense"),pe=sum(prv,"expense");
if(ce>0&&pe>0){const p=Math.round((ce-pe)/pe*100);o.push(`Bulan ini pengeluaran ${rp(ce)}, ${p>=0?"naik":"turun"} ${Math.abs(p)}% dari bulan lalu (${rp(pe)}).`)}
const byc={};cur.filter(t=>t.type==="expense").forEach(t=>byc[t.cat]=(byc[t.cat]||0)+t.amt);const tp=Object.entries(byc).sort((a,b)=>b[1]-a[1])[0];if(tp)o.push(`Pengeluaran terbesar bulan ini: ${tp[0]} (${rp(tp[1])}).`);
S.budgets.forEach(b=>{const u=spent(b),p=Math.round(u/b.limit*100);if(p>=75)o.push(`Anggaran ${b.cat==="*"?"total":b.cat} ${p>100?"terlampaui "+rp(u-b.limit):"terpakai "+p+"%, sisa "+rp(b.limit-u)}.`)});
S.bills.filter(b=>!b.done&&daysTo(b.due)<=3).forEach(b=>o.push(`Tagihan ${b.name} ${rp(b.amt)} jatuh tempo: ${dueTxt(b.due)}.`));
[["debts","Utang ke"],["receivables","Piutang dari"]].forEach(([c,l])=>S[c].filter(x=>rem(x)>0&&x.due&&daysTo(x.due)<=3).forEach(x=>o.push(`${l} ${x.who} sisa ${rp(rem(x))} jatuh tempo: ${dueTxt(x.due)}.`)));
